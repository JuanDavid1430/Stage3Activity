function quizOptions(q,i){return q.opts.map((o,k)=>{const chosen=state.quizChoices[i]===o;const judged=state.quizJudged[i];const isWrong=judged&&chosen&&o!==q.answer;const isRight=judged&&chosen&&o===q.answer;return `<label class="choice ${isWrong?'wrong':''} ${isRight?'correct':''}"><input type="radio" name="quiz${i}" value="${esc(o)}" data-quiz="${i}" ${chosen?'checked':''} ${state.quizSolved?'disabled':''}><span>${esc(o)}</span></label>`}).join('')}

el('app').addEventListener('change',e=>{const q=e.target.closest('input[data-quiz]');if(q){state.quizChoices[+q.dataset.quiz]=q.value;q.closest('.choices').querySelectorAll('.wrong').forEach(item=>item.classList.remove('wrong'));const check=el('app').querySelector('button[data-action="check-quiz"]');if(check)check.disabled=state.quizSolved||!state.quizChoices.every(x=>x!==null)}});
el('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='secretCode')checkCode()});
el('app').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;switch(action){case 'start':next('spot');break;case 'spot':chooseSpot(b.dataset.key);break;case 'next-spot':if(state.found.size===2)next('audio');break;case 'check-quiz':checkQuiz();break;case 'unlock':checkCode();break;case 'next-audio':if(state.codeUnlocked)next('directions');break;case 'add-word':{let i=+b.dataset.sent,w=DATA.sentences[i].words[+b.dataset.word];if(!state.orders[i].includes(w)&&!state.sentenceSolved[i]){state.orders[i].push(w);render()}break}case 'remove-word':{let i=+b.dataset.sent;if(!state.sentenceSolved[i]){state.orders[i].splice(+b.dataset.index,1);render()}break}case 'clear-sentence':{let i=+b.dataset.sent;if(!state.sentenceSolved[i]){state.orders[i]=[];render()}break}case 'check-sentence':checkSentence(+b.dataset.sent);break;case 'finish':if(state.sentenceSolved.every(Boolean))next('result');break;case 'reset':reset();break}});
render();
</script>
</body></html>
